<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#27272a" stroke-width="3"/>

  <!-- Inner Studio Canvas Viewport Preview -->
  <rect x="80" y="80" width="352" height="230" rx="24" fill="#0f111a" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.9"/>

  <!-- Window Header with Traffic Lights -->
  <rect x="80" y="80" width="352" height="34" rx="24" fill="#181824"/>
  <rect x="80" y="98" width="352" height="16" fill="#181824"/>
  <circle cx="106" cy="97" r="5" fill="#ff5f56"/>
  <circle cx="122" cy="97" r="5" fill="#ffbd2e"/>
  <circle cx="138" cy="97" r="5" fill="#27c93f"/>

  <!-- Reticle & Auto-Zoom Focus Target -->
  <g filter="url(#glow)">
    <circle cx="256" cy="195" r="42" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-dasharray="8 6"/>
    <circle cx="256" cy="195" r="16" fill="url(#primaryGrad)" opacity="0.3"/>
    <circle cx="256" cy="195" r="4" fill="#ffffff"/>

    <!-- Dynamic Action Crosshairs -->
    <line x1="256" y1="135" x2="256" y2="147" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="243" x2="256" y2="255" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="196" y1="195" x2="208" y2="195" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="304" y1="195" x2="316" y2="195" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Spring Physics Trajectory Line -->
  <path d="M 120 400 C 180 340, 210 260, 256 195" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="5 5" opacity="0.8"/>

  <!-- Stylized Vector Mouse Pointer -->
  <g transform="translate(256, 195) filter(url(#glow))">
    <path d="M 0 0 L 0 34 L 10 24 L 20 40 L 26 36 L 16 21 L 28 21 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Bottom Timeline & Zoom Keyframe Track -->
  <rect x="80" y="340" width="352" height="42" rx="12" fill="#12131c" stroke="#27272a" stroke-width="1.5"/>
  <rect x="180" y="346" width="110" height="30" rx="8" fill="url(#primaryGrad)" opacity="0.9"/>
  <text x="235" y="366" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">AUTO-ZOOM</text>

  <!-- Timeline Playhead -->
  <line x1="235" y1="332" x2="235" y2="390" stroke="#ffffff" stroke-width="2.5"/>
  <polygon points="230,332 240,332 235,340" fill="#ffffff"/>
</svg>
